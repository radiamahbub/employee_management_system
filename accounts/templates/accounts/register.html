{% extends 'auth_base.html' %}

{% block title %}
    EMS | Register
{% endblock title %}

{% block content %}

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0" style="max-width: 500px; width: 100%;">
        <div class="card-body p-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Create an Account</h2>
                <p class="text-muted">
                    Register to start using the EMS
                </p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">User Type</label>
                    <select class="form-select" name="user_type" aria-label="Default select example">
                    <option selected>Kindly select role</option>
                    <option value="Employer">Employer</option>
                    <option value="Employee">Employee</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0 text-muted">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-decoration-none">
                        Login
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock content %}
